[package]
name = "pi-natives"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
mimalloc = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-derive = "3"
bytes = "1.7"
bytes-utils = "0.1"
brush-core = { version = "0.4.0", path = "../brush-core-vendored", optional = true }
brush-builtins = { version = "0.1.0", path = "../brush-builtins-vendored", optional = true }
parking_lot = "0.12.5"
dashmap = "6.1"
clap = { version = "4", features = ["derive"], optional = true }
os_pipe = { version = "1", optional = true }
portable-pty = "0.9"
grep-regex = { version = "0.1", optional = true }
fff-grep = { version = "0.4", optional = true }
fff = { package = "fff-search", version = "0.4.2", default-features = false, features = [
   "zlob",
], optional = true }
grep-matcher = { version = "0.1", optional = true }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
ast-grep-core = { version = "0.39", default-features = false, features = [
   "tree-sitter",
], optional = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-clojure = { version = "0.1", optional = true }
tree-sitter-cmake = { version = "0.7.1", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-diff = { version = "0.1", optional = true }
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-erlang = { version = "0.15.0", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-graphql = { version = "0.1.0", optional = true }
tree-sitter-glimmer = { version = "0.0.1", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-hcl = { version = "1.1", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-ini = { version = "1.4.0", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.23", optional = true }
tree-sitter-just = { version = "0.2.0", optional = true }
tree-sitter-julia = { version = "0.23", optional = true }
tree-sitter-kotlin = { version = "0.4", package = "tree-sitter-kotlin-sg", optional = true }
tree-sitter-lua = { version = "0.2", optional = true }
tree-sitter-make = { version = "1.1", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-objc = { version = "3.0", optional = true }
tree-sitter-ocaml = { version = "0.24.2", optional = true }
tree-sitter-odin = { version = "1.3", optional = true }
tree-sitter-perl = { version = "0.1.0", package = "tree-sitter-perl-next", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-powershell = { version = "0.26.3", optional = true }
tree-sitter-proto = { version = "0.4.0", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-r = { version = "1.2.0", optional = true }
tree-sitter-regex = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.24", optional = true }
tree-sitter-solidity = { version = "1.2", optional = true }
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel", optional = true }
tree-sitter-starlark = { version = "1.3", optional = true }
tree-sitter-svelte = { version = "0.1.1", package = "tree-sitter-svelte-next", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-tlaplus = { version = "1.5", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-verilog = { version = "1.0", optional = true }
tree-sitter-vue = { version = "0.1.0", package = "tree-sitter-vue-next", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
inferno = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = [
   "png",
   "jpeg",
   "gif",
   "webp",
], optional = true }
arboard = { version = "3.5.0", features = ["wayland-data-control"], optional = true }
icy_sixel = { version = "0.5", optional = true }
unicode-segmentation = "1.11"
unicode-width = "0.2"
syntect = { version = "5.3", default-features = false, features = [
   "default-syntaxes",
   "default-themes",
   "regex-fancy",
], optional = true }
html-to-markdown-rs = { version = "2.24", default-features = false, optional = true }
phf = { version = "0.13", features = ["macros"] }
smallvec = { version = "1.15.1", features = [
   "serde",
   "write",
   "union",
   "specialization",
   "const_new",
] }
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
regex = "1"
similar = "3.0.0"
path-clean = "1"
pathdiff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[features]
default = ["full"]
full = [
   "chunk-native",
   "clipboard-native",
   "html-to-markdown-native",
   "syntax-highlighting",
   "structural-search-native",
   "image",
   "shell-native",
   "text-search-native",
   "fuzzy-search-native",
   "discovery-native",
]

syntax-highlighting = ["dep:syntect"]
image = ["dep:image", "dep:icy_sixel"]
clipboard-native = ["dep:arboard"]
html-to-markdown-native = ["dep:html-to-markdown-rs"]

tree-sitter-support = [
   "dep:tree-sitter",
   "dep:tree-sitter-astro",
   "dep:tree-sitter-bash",
   "dep:tree-sitter-c",
   "dep:tree-sitter-clojure",
   "dep:tree-sitter-cmake",
   "dep:tree-sitter-c-sharp",
   "dep:tree-sitter-cpp",
   "dep:tree-sitter-css",
   "dep:tree-sitter-diff",
   "dep:tree-sitter-dockerfile",
   "dep:tree-sitter-elixir",
   "dep:tree-sitter-erlang",
   "dep:tree-sitter-go",
   "dep:tree-sitter-graphql",
   "dep:tree-sitter-glimmer",
   "dep:tree-sitter-haskell",
   "dep:tree-sitter-hcl",
   "dep:tree-sitter-html",
   "dep:tree-sitter-ini",
   "dep:tree-sitter-java",
   "dep:tree-sitter-javascript",
   "dep:tree-sitter-json",
   "dep:tree-sitter-just",
   "dep:tree-sitter-julia",
   "dep:tree-sitter-kotlin",
   "dep:tree-sitter-lua",
   "dep:tree-sitter-make",
   "dep:tree-sitter-md",
   "dep:tree-sitter-nix",
   "dep:tree-sitter-objc",
   "dep:tree-sitter-ocaml",
   "dep:tree-sitter-odin",
   "dep:tree-sitter-perl",
   "dep:tree-sitter-php",
   "dep:tree-sitter-powershell",
   "dep:tree-sitter-proto",
   "dep:tree-sitter-python",
   "dep:tree-sitter-r",
   "dep:tree-sitter-regex",
   "dep:tree-sitter-ruby",
   "dep:tree-sitter-rust",
   "dep:tree-sitter-scala",
   "dep:tree-sitter-solidity",
   "dep:tree-sitter-sql",
   "dep:tree-sitter-starlark",
   "dep:tree-sitter-svelte",
   "dep:tree-sitter-swift",
   "dep:tree-sitter-toml-ng",
   "dep:tree-sitter-tlaplus",
   "dep:tree-sitter-typescript",
   "dep:tree-sitter-verilog",
   "dep:tree-sitter-vue",
   "dep:tree-sitter-xml",
   "dep:tree-sitter-yaml",
   "dep:tree-sitter-zig",
]

chunk-native = ["tree-sitter-support"]

# Embedded ast-grep implementation; lean/minimal builds use the external
# `ast-grep` command instead.
structural-search-native = ["dep:ast-grep-core", "tree-sitter-support"]
structural-search-system = []

shell-native = ["dep:brush-core", "dep:brush-builtins", "dep:clap", "dep:os_pipe"]
shell-system = []

text-search-native = ["dep:grep-regex", "dep:fff-grep", "dep:grep-matcher"]
text-search-system = []

fuzzy-search-native = ["dep:fff"]
fuzzy-search-system = []

discovery-native = []
discovery-system = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

windows-sys = { version = "0.61", features = [
   "Win32_Foundation",
   "Win32_Storage_ProjectedFileSystem",
   "Win32_System_Com",
   "Win32_System_LibraryLoader",
] }

[build-dependencies]
napi-build = "2"
cc = "1"
